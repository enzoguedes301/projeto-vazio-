    <!--
      Carregador de cidade. Pergunta ao servidor (GET /api/cidade) qual é a cidade do lead:
        1. cidade na URL            /ituiutaba-mg, /sao-paulo-sp/sacola ...
        2. escolha feita no seletor localStorage "cidade_escolhida"
        3. detecção por IP          feita no servidor
        4. padrão                   dados/cidades.json (São Paulo - SP)
      Precisa rodar ANTES do bundle, porque o app lê window.companySlug ao carregar.
    -->
    <script>
    (async function () {
      var APP_ROUTES = ["erro-404", "table-not-found", "e", "admin", "api"];
      var seg = location.pathname.split("/")[1] || "";
      var segEhRota = APP_ROUTES.indexOf(seg) !== -1;
      var escolhida = null;
      try { escolhida = localStorage.getItem("cidade_escolhida"); } catch (e) {}

      var slugPedido = (seg && !segEhRota) ? seg : escolhida;
      var c;
      try {
        c = await fetch("/api/cidade" + (slugPedido ? "?slug=" + encodeURIComponent(slugPedido) : "")).then(function (r) { return r.json(); });
      } catch (e) {
        document.body.innerHTML = "<p style='font-family:sans-serif;padding:24px'>Não foi possível carregar o cardápio. Verifique a conexão e recarregue.</p>";
        return;
      }

      window.__CIDADE = {
        id: c.id, slug: c.slug, nome: c.nome, uf: c.uf, origem: c.origem,
        profile: "/api/perfil/" + c.slug + ".json",
        cardapio: "/dados/cardapios/" + c.cardapio
      };
      window.companySlug = c.slug;
      window.companyId = c.id;

      // raiz, ou slug que não resolveu -> URL canônica da cidade escolhida
      if (!seg || (!segEhRota && seg !== c.slug)) {
        history.replaceState(null, "", "/" + c.slug + location.search + location.hash);
      }

      var s = document.createElement("script");
      s.type = "module"; s.crossOrigin = ""; s.src = "/assets/index-DXIKYQC4.js";
      document.head.appendChild(s);

      var w = document.createElement("script");
      w.src = "/cidades.js"; w.defer = true;
      document.head.appendChild(w);
    })();
    </script>
